name: Options Collector

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: Capture duration for each segment, in minutes
        required: true
        default: "5"
        type: string
      underlyings:
        description: Space-separated CoinDCX option underlyings
        required: true
        default: "BTC ETH SOL XAUT"
        type: string
      chain_runs:
        description: Number of consecutive capture segments
        required: true
        default: "12"
        type: string

# Intentionally no schedule/cron trigger.
# One manual workflow run owns the complete bootstrap capture chain.
concurrency:
  group: coindcx-options-collector
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          python -m playwright install --with-deps chromium

      - name: Unit tests
        run: python -m pytest -q

      - name: Resolve and validate inputs
        id: inputs
        env:
          DURATION: ${{ inputs.duration_minutes }}
          UNDERLYINGS: ${{ inputs.underlyings }}
          CHAIN_RUNS: ${{ inputs.chain_runs }}
        run: |
          python - <<'PY'
          import os
          duration = int(os.environ.get('DURATION') or 5)
          chain_runs = int(os.environ.get('CHAIN_RUNS') or 12)
          underlyings = os.environ.get('UNDERLYINGS') or 'BTC ETH SOL XAUT'
          if not 1 <= duration <= 30:
              raise SystemExit('duration_minutes must be between 1 and 30 for bootstrap mode')
          if not 1 <= chain_runs <= 288:
              raise SystemExit('chain_runs must be between 1 and 288')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f'duration={duration}\n')
              f.write(f'underlyings={underlyings}\n')
              f.write(f'chain_runs={chain_runs}\n')
          print(f'duration={duration}')
          print(f'underlyings={underlyings}')
          print(f'chain_runs={chain_runs}')
          PY

      - name: Capture consecutive segments
        env:
          DURATION: ${{ steps.inputs.outputs.duration }}
          UNDERLYINGS: ${{ steps.inputs.outputs.underlyings }}
          CHAIN_RUNS: ${{ steps.inputs.outputs.chain_runs }}
        run: |
          set -euo pipefail
          for i in $(seq 1 "$CHAIN_RUNS"); do
            echo "===== CAPTURE SEGMENT $i/$CHAIN_RUNS ====="
            SEGMENT_DIR="data/raw/segment-$(printf '%03d' "$i")"
            mkdir -p "$SEGMENT_DIR"
            python -m src.options_collector \
              --duration-minutes "$DURATION" \
              --underlyings $UNDERLYINGS \
              --out-dir "$SEGMENT_DIR"
            python tools/validate_options_capture.py "$SEGMENT_DIR"
            NORMALIZED=$(find "$SEGMENT_DIR" -name normalized_events.jsonl -type f | sort | tail -n 1 || true)
            if [ -f "$NORMALIZED" ] && [ -s "$NORMALIZED" ]; then
              python -m src.options_research "$NORMALIZED" \
                --output "$SEGMENT_DIR/options_research.csv"
            else
              printf 'status,message\nNO_NORMALIZED_RECORDS,Raw network capture preserved\n' \
                > "$SEGMENT_DIR/options_research.csv"
            fi
          done

      - name: Build capture manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('data/raw')
          segments = []
          for p in sorted(root.glob('segment-*')):
              segments.append({
                  'segment': p.name,
                  'files': sorted(str(x.relative_to(root)) for x in p.rglob('*') if x.is_file()),
                  'metadata_present': (p / 'run_metadata.json').exists(),
              })
          (root / 'capture_manifest.json').write_text(
              json.dumps({'segments': segments}, indent=2), encoding='utf-8'
          )
          print(json.dumps({'segments': len(segments)}, indent=2))
          PY

      - name: Upload raw options capture
        uses: actions/upload-artifact@v4
        with:
          name: coindcx-options-bootstrap-${{ github.run_id }}
          path: data/raw/
          retention-days: 7
          if-no-files-found: error

      - name: Upload research tables
        uses: actions/upload-artifact@v4
        with:
          name: coindcx-options-research-${{ github.run_id }}
          path: data/raw/**/options_research.csv
          retention-days: 30
          if-no-files-found: warn
