name: Options Collector

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: Collection duration in minutes
        required: true
        default: "120"
        type: string
      underlyings:
        description: Space-separated CoinDCX option underlyings
        required: true
        default: "BTC ETH SOL XAUT"
        type: string

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Validate inputs
        env:
          DURATION: ${{ inputs.duration_minutes }}
        run: |
          python - <<'PY'
          import os
          value = int(os.environ['DURATION'])
          if not 1 <= value <= 230:
              raise SystemExit('duration_minutes must be between 1 and 230')
          PY

      - name: Capture public options market data
        env:
          DURATION: ${{ inputs.duration_minutes }}
          UNDERLYINGS: ${{ inputs.underlyings }}
        run: |
          python -m src.options_collector \
            --duration-minutes "$DURATION" \
            --underlyings $UNDERLYINGS \
            --out-dir data/raw

      - name: Validate capture structure
        run: python tools/validate_options_capture.py data/raw

      - name: Upload raw options capture
        uses: actions/upload-artifact@v4
        with:
          name: coindcx-options-${{ github.run_id }}
          path: data/raw/
          retention-days: 7
          if-no-files-found: error
