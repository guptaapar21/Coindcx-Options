name: Options Collector

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: Collection duration in minutes
        required: true
        default: "5"
        type: string
      underlyings:
        description: Space-separated CoinDCX option underlyings
        required: true
        default: "BTC ETH SOL XAUT"
        type: string
      chain_runs:
        description: Number of consecutive 5-minute runs in this self-triggered chain
        required: true
        default: "12"
        type: string

# No scheduled/cron trigger. One manual run can hand off to the next run.
concurrency:
  group: coindcx-options-collector
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          python -m playwright install --with-deps chromium

      - name: Unit tests
        run: python -m pytest -q

      - name: Resolve and validate chain inputs
        id: inputs
        env:
          DURATION: ${{ inputs.duration_minutes }}
          UNDERLYINGS: ${{ inputs.underlyings }}
          CHAIN_RUNS: ${{ inputs.chain_runs }}
        run: |
          duration="${DURATION:-5}"
          underlyings="${UNDERLYINGS:-BTC ETH SOL XAUT}"
          chain_runs="${CHAIN_RUNS:-12}"
          python - <<'PY'
          import os
          duration = int(os.environ['DURATION'] or 5)
          chain_runs = int(os.environ['CHAIN_RUNS'] or 12)
          if not 1 <= duration <= 230:
              raise SystemExit('duration_minutes must be between 1 and 230')
          if not 1 <= chain_runs <= 288:
              raise SystemExit('chain_runs must be between 1 and 288')
          PY
          echo "duration=$duration" >> "$GITHUB_OUTPUT"
          echo "underlyings=$underlyings" >> "$GITHUB_OUTPUT"
          echo "chain_runs=$chain_runs" >> "$GITHUB_OUTPUT"

      - name: Capture public options market data
        env:
          DURATION: ${{ steps.inputs.outputs.duration }}
          UNDERLYINGS: ${{ steps.inputs.outputs.underlyings }}
        run: |
          python -m src.options_collector \
            --duration-minutes "$DURATION" \
            --underlyings $UNDERLYINGS \
            --out-dir data/raw

      - name: Validate capture structure
        run: python tools/validate_options_capture.py data/raw

      - name: Build research table
        run: |
          NORMALIZED=$(find data/raw -name normalized_events.jsonl -type f | sort | tail -n 1)
          if [ -f "$NORMALIZED" ] && [ -s "$NORMALIZED" ]; then
            python -m src.options_research "$NORMALIZED" --output data/options_research.csv
          else
            printf 'status,message\nNO_NORMALIZED_RECORDS,Raw network capture preserved\n' > data/options_research.csv
          fi

      - name: Upload raw options capture
        uses: actions/upload-artifact@v4
        with:
          name: coindcx-options-${{ github.run_id }}
          path: data/raw/
          retention-days: 7
          if-no-files-found: error

      - name: Upload research table
        uses: actions/upload-artifact@v4
        with:
          name: coindcx-options-research-${{ github.run_id }}
          path: data/options_research.csv
          retention-days: 30
          if-no-files-found: error

      - name: Self-trigger next 5-minute run
        if: ${{ !cancelled() && fromJSON(steps.inputs.outputs.chain_runs) > 1 }}
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_RUNS: ${{ fromJSON(steps.inputs.outputs.chain_runs) - 1 }}
          NEXT_DURATION: ${{ steps.inputs.outputs.duration }}
          NEXT_UNDERLYINGS: ${{ steps.inputs.outputs.underlyings }}
        run: |
          gh workflow run options-collector.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f duration_minutes="$NEXT_DURATION" \
            -f underlyings="$NEXT_UNDERLYINGS" \
            -f chain_runs="$NEXT_RUNS"
          echo "Next self-triggered capture queued; remaining chain runs: $NEXT_RUNS"
