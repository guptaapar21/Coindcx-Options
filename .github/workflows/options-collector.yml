name: Options Collector

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: Collection duration in minutes
        required: true
        default: "5"
        type: string
      underlyings:
        description: Space-separated CoinDCX option underlyings
        required: true
        default: "BTC ETH SOL XAUT"
        type: string

concurrency:
  group: coindcx-options-collector
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          python -m playwright install --with-deps chromium

      - name: Unit tests
        run: python -m pytest -q

      - name: Resolve inputs
        id: inputs
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_DURATION: ${{ inputs.duration_minutes }}
          INPUT_UNDERLYINGS: ${{ inputs.underlyings }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            echo "duration=5" >> "$GITHUB_OUTPUT"
            echo "underlyings=BTC ETH SOL XAUT" >> "$GITHUB_OUTPUT"
          else
            echo "duration=${INPUT_DURATION:-5}" >> "$GITHUB_OUTPUT"
            echo "underlyings=${INPUT_UNDERLYINGS:-BTC ETH SOL XAUT}" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate inputs
        env:
          DURATION: ${{ steps.inputs.outputs.duration }}
        run: |
          python - <<'PY'
          import os
          value = int(os.environ['DURATION'])
          if not 1 <= value <= 230:
              raise SystemExit('duration_minutes must be between 1 and 230')
          PY

      - name: Capture public options market data
        env:
          DURATION: ${{ steps.inputs.outputs.duration }}
          UNDERLYINGS: ${{ steps.inputs.outputs.underlyings }}
        run: |
          python -m src.options_collector \
            --duration-minutes "$DURATION" \
            --underlyings $UNDERLYINGS \
            --out-dir data/raw

      - name: Validate capture structure
        run: python tools/validate_options_capture.py data/raw

      - name: Build research table
        run: |
          NORMALIZED=$(find data/raw -name normalized_events.jsonl -type f | sort | tail -n 1)
          if [ -f "$NORMALIZED" ] && [ -s "$NORMALIZED" ]; then
            python -m src.options_research "$NORMALIZED" --output data/options_research.csv
          else
            printf 'status,message\nNO_NORMALIZED_RECORDS,Raw network capture preserved\n' > data/options_research.csv
          fi

      - name: Upload raw options capture
        uses: actions/upload-artifact@v4
        with:
          name: coindcx-options-${{ github.run_id }}
          path: data/raw/
          retention-days: 7
          if-no-files-found: error

      - name: Upload research table
        uses: actions/upload-artifact@v4
        with:
          name: coindcx-options-research-${{ github.run_id }}
          path: data/options_research.csv
          retention-days: 30
          if-no-files-found: error
